<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatToEat? (WTE)</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="container">
        <h1 data-i18n="app.title">WhatToEat? (WTE)</h1>
        <p class="subtitle" data-i18n="app.subtitle">
          Plan lunch and dinner, stay on budget, and update your shopping list
          automatically.
        </p>
      </div>
    </header>

    <main class="container app-main">
      <section id="system-message" class="message hidden" aria-live="polite"></section>

      <section id="auth-panel" class="card">
        <h2 data-i18n="auth.title">Sign in to your account</h2>
        <p id="auth-mode-note" class="muted"></p>

        <form id="email-auth-form" class="stack" autocomplete="on">
          <label>
            <span data-i18n="auth.label.email">Email</span>
            <input id="auth-email" name="email" type="email" required />
          </label>

          <label>
            <span data-i18n="auth.label.password">Password</span>
            <input
              id="auth-password"
              name="password"
              type="password"
              minlength="6"
              required
            />
          </label>

          <div class="row">
            <button id="email-sign-in" type="button" data-i18n="auth.button.signIn">
              Sign in
            </button>
            <button
              id="email-sign-up"
              type="button"
              class="ghost"
              data-i18n="auth.button.signUp"
            >
              Create account
            </button>
          </div>
        </form>

        <div class="divider" data-i18n="auth.orContinue">or continue with</div>

        <div class="row">
          <button id="google-auth" type="button" class="ghost" data-i18n="auth.button.google">
            Google
          </button>
          <button id="apple-auth" type="button" class="ghost" data-i18n="auth.button.apple">
            Apple
          </button>
        </div>
      </section>

      <section id="app-panel" class="hidden">
        <section class="card user-row">
          <div>
            <h2 class="h3" data-i18n="account.title">Account</h2>
            <p class="muted" id="user-email">-</p>
          </div>
          <button
            id="logout-button"
            type="button"
            class="ghost"
            data-i18n="account.button.signOut"
          >
            Sign out
          </button>
        </section>

        <section class="card">
          <h2 data-i18n="settings.title">Preferences</h2>

          <form id="settings-form" class="stack">
            <div class="grid two">
              <label>
                <span data-i18n="settings.label.language">App language</span>
                <select name="language" id="language-select"></select>
              </label>

              <label>
                <span data-i18n="settings.label.shoppingDay">Shopping day</span>
                <select name="shoppingDay" id="shopping-day-select"></select>
              </label>
            </div>

            <div class="grid two">
              <label>
                <span data-i18n="settings.label.shoppingIntervalDays">
                  Shopping interval (days)
                </span>
                <input
                  type="number"
                  name="shoppingIntervalDays"
                  min="3"
                  max="21"
                  step="1"
                />
              </label>

              <label>
                <span data-i18n="settings.label.maxPrepMinutes">
                  Max preparation time (minutes)
                </span>
                <input
                  type="number"
                  name="maxPrepMinutes"
                  min="15"
                  max="180"
                  step="5"
                />
              </label>
            </div>

            <div class="grid two">
              <label>
                <span data-i18n="settings.label.budgetMin">Budget min (EUR)</span>
                <input type="number" name="budgetMin" min="0" step="1" />
              </label>
              <label>
                <span data-i18n="settings.label.budgetMax">Budget max (EUR)</span>
                <input type="number" name="budgetMax" min="0" step="1" />
              </label>
            </div>

            <div class="grid two">
              <label>
                <span data-i18n="settings.label.dietProfile">Diet profile</span>
                <select name="dietProfile" id="diet-profile-select"></select>
              </label>
              <label>
                <span data-i18n="settings.label.difficulty">Difficulty</span>
                <select name="difficulty" id="difficulty-select"></select>
              </label>
            </div>

            <div class="grid two">
              <label>
                <span data-i18n="settings.label.adults">Adults</span>
                <input type="number" name="adults" min="1" max="8" step="1" />
              </label>

              <label>
                <span data-i18n="settings.label.childrenAges">
                  Children ages (comma separated, example: 4, 8)
                </span>
                <input
                  type="text"
                  name="childrenAgesInput"
                  data-i18n-placeholder="settings.placeholder.childrenAges"
                  placeholder="4, 8"
                />
              </label>
            </div>

            <fieldset>
              <legend data-i18n="settings.legend.cuisines">Preferred cuisines</legend>
              <div id="cuisine-options" class="chip-group"></div>
            </fieldset>

            <fieldset>
              <legend data-i18n="settings.legend.allergies">Allergies / intolerances</legend>
              <div id="allergy-options" class="chip-group"></div>
            </fieldset>

            <div class="row">
              <button type="button" id="save-settings" class="ghost" data-i18n="settings.button.save">
                Save settings
              </button>
              <button type="submit" id="generate-plan" data-i18n="settings.button.generate">
                Generate plan
              </button>
            </div>
          </form>
        </section>

        <section class="card">
          <h2 data-i18n="preview.title">Upcoming meal preview</h2>
          <p id="shopping-cycle-hint" class="muted"></p>
          <ul id="preview-list" class="list"></ul>
        </section>

        <section class="card">
          <h2 data-i18n="plan.title">Meal plan</h2>

          <details id="shopping-list-panel" open>
            <summary data-i18n="shopping.summaryTitle">Shopping list</summary>
            <div id="shopping-summary" class="stack small"></div>
            <ul id="shopping-list" class="list"></ul>
          </details>

          <div id="meal-plan" class="meal-grid"></div>
        </section>

        <section class="card">
          <h2 data-i18n="history.title">Plan history</h2>
          <ul id="history-list" class="list"></ul>
        </section>
      </section>
    </main>

    <noscript>
      <p class="container message warning" data-i18n="noscript.message">
        JavaScript is required to run this application.
      </p>
    </noscript>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
